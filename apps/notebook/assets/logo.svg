<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- ChalkMath: a blackboard with e^{πi} in chalk -->
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4a3e"/>
      <stop offset="1" stop-color="#1e3a30"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a06a38"/>
      <stop offset="1" stop-color="#7d4f27"/>
    </linearGradient>
  </defs>
  <rect x="2" y="5" width="60" height="50" rx="5" fill="url(#wood)"/>
  <rect x="6.5" y="9.5" width="51" height="38" rx="2.5" fill="url(#board)"/>
  <!-- chalk dust haze -->
  <rect x="6.5" y="9.5" width="51" height="38" rx="2.5" fill="#ffffff" opacity="0.04"/>
  <!-- tray and a stick of chalk -->
  <rect x="7" y="50.5" width="50" height="3.2" rx="1" fill="#c48a52"/>
  <rect x="38" y="49.2" width="10" height="2.6" rx="1.3" fill="#f6f2e8"/>
  <!-- e -->
  <g fill="none" stroke="#f7f3ea" stroke-linecap="round" stroke-linejoin="round" opacity="0.96">
    <path d="M17 31.5 h9.5 c0.3-4.6 -2.6-7 -5.4-6.4 c-4.4 0.9 -5.4 7.4 -3.6 10.6 c1.7 3 6.4 3.4 9.6 0.6" stroke-width="2.7"/>
    <!-- π -->
    <path d="M31.5 19.5 c3 -0.6 7.5 -0.6 10.5 -0.2" stroke-width="2.1"/>
    <path d="M34 20 c-0.2 3 -0.5 5.5 -1.6 7.6" stroke-width="2.1"/>
    <path d="M39.5 19.8 c-0.2 3.4 0.2 6.2 1.6 7.6" stroke-width="2.1"/>
    <!-- i -->
    <path d="M46 22.5 c0.2 2 0 3.6 -0.4 5.2" stroke-width="2.1"/>
  </g>
  <circle cx="46.4" cy="18.6" r="1.25" fill="#f7f3ea"/>
  <!-- a little dust on the board -->
  <circle cx="14" cy="42" r="0.6" fill="#ffffff" opacity="0.35"/>
  <circle cx="50" cy="40" r="0.5" fill="#ffffff" opacity="0.3"/>
</svg>
