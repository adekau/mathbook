name = "mathproofs"
version = "0.1.0"
defaultTargets = ["Proofs"]

# Theorems only. `engine/` is executable code and must never depend on this package or on
# Mathlib (scripts/check-engine-deps.sh enforces it). ℝ-valued semantics and HasDerivAt
# proofs land here in M3/M4; until then this package just checks that the split builds.

[[require]]
name = "mathengine"
path = "../engine"

# Pinned to a Mathlib *release tag*, not master: tag v4.33.1 targets leanprover/lean4:v4.33.1,
# which is exactly `engine/lean-toolchain`, so the two packages share one toolchain (the M1 brief's
# rule) without moving the engine off latest stable. Bump this tag and both lean-toolchain files
# together; `lake exe cache get` in this directory fetches prebuilt oleans (building Mathlib from
# source takes hours).
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.33.1"

[[lean_lib]]
name = "Proofs"
